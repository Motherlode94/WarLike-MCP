<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>WarLike Local Asset Preview</title><style>body{font:16px system-ui;background:#171b20;color:#eee;margin:2rem}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.tile{background:#242a30;padding:8px;overflow-wrap:anywhere}canvas{width:100%;height:auto;background:#111}small{display:block;color:#bbc4cd}</style></head><body><h1>WarLike Local Preview</h1><p>Les fichiers sélectionnés restent dans cet onglet. Aucun transfert réseau.</p><label>Dossier images <input type="file" id="folder" webkitdirectory multiple></label><p id="status" role="status"></p><div id="grid"></div><script>
const input=document.getElementById('folder'),grid=document.getElementById('grid'),status=document.getElementById('status');let generation=0;
input.onchange=async()=>{const current=++generation;grid.replaceChildren();const selected=Array.from(input.files||[]).filter(f=>/\.(png|jpe?g|webp|gif)$/i.test(f.name)&&f.size<=16*1024*1024),files=selected.slice(0,100);let shown=0;for(const f of files){if(current!==generation)return;const url=URL.createObjectURL(f);try{const image=new Image();image.src=url;await image.decode();if(current!==generation)return;if(image.naturalWidth*image.naturalHeight>32000000)continue;const tile=document.createElement('div'),canvas=document.createElement('canvas'),caption=document.createElement('small');tile.className='tile';canvas.width=160;canvas.height=112;const scale=Math.min(160/image.naturalWidth,112/image.naturalHeight,1),w=image.naturalWidth*scale,h=image.naturalHeight*scale;canvas.getContext('2d').drawImage(image,(160-w)/2,(112-h)/2,w,h);caption.textContent=f.webkitRelativePath+' · '+image.naturalWidth+'×'+image.naturalHeight;tile.append(canvas,caption);grid.append(tile);shown++;}catch{}finally{URL.revokeObjectURL(url);}}if(current===generation)status.textContent=shown+' miniatures sur '+selected.length+' images admissibles (maximum 100 par sélection).';};
</script></body></html>
